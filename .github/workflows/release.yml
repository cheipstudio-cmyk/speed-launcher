name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # v93: usa Gradle 8.4 installato dal sistema (non dal wrapper).
      # Il wrapper del repo è corrotto (jar punta a Gradle 9.4.1 anche
      # se properties dice 8.4). Bypassiamo il wrapper completamente.
      - name: Setup Gradle 8.4
        run: |
          # Scarica Gradle 8.4 direttamente
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle-install
          # Aggiungo al PATH
          echo "/opt/gradle-install/gradle-8.4/bin" >> $GITHUB_PATH

      - name: Verify Gradle version
        run: gradle --version

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/SpeedLauncher-${{ github.ref_name }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/SpeedLauncher-${{ github.ref_name }}.apk
          tag_name: ${{ github.ref_name }}
          name: Speed Launcher ${{ github.ref_name }}
          body: |
            Speed Launcher beta build.
            
            Scarica l'APK qui sotto e installa.
            Se Android blocca l'installazione, abilita "Sorgenti sconosciute" nelle impostazioni di sicurezza.
            
            Gli utenti che hanno già una versione precedente (v0.83+) possono aggiornare direttamente 
            dall'app: Impostazioni → Controlla aggiornamenti.
          draft: false
          prerelease: true
