name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # v91: NON uso gradle/actions/setup-gradle perché installava Gradle 9.4.1
      # ignorando il wrapper. Usiamo il wrapper del progetto (Gradle 8.4) che è
      # compatibile con AGP 8.2.2.
      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Verify Gradle version
        run: ./gradlew --version

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/SpeedLauncher-${{ github.ref_name }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/SpeedLauncher-${{ github.ref_name }}.apk
          tag_name: ${{ github.ref_name }}
          name: Speed Launcher ${{ github.ref_name }}
          body: |
            Speed Launcher beta build.
            
            Scarica l'APK qui sotto e installa.
            Se Android blocca l'installazione, abilita "Sorgenti sconosciute" nelle impostazioni di sicurezza.
            
            Gli utenti che hanno già una versione precedente (v0.83+) possono aggiornare direttamente 
            dall'app: Impostazioni → Controlla aggiornamenti.
          draft: false
          prerelease: true
