name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission
        run: chmod +x gradlew

      # v92: forzo il wrapper a Gradle 8.4 PRIMA di buildare.
      # Questo sovrascrive gradle-wrapper.properties e ri-scarica il jar corretto.
      - name: Force Gradle 8.4 wrapper
        run: |
          cat > gradle/wrapper/gradle-wrapper.properties << 'PROPS'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          PROPS
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Verify Gradle version
        run: ./gradlew --version

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/SpeedLauncher-${{ github.ref_name }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/SpeedLauncher-${{ github.ref_name }}.apk
          tag_name: ${{ github.ref_name }}
          name: Speed Launcher ${{ github.ref_name }}
          body: |
            Speed Launcher beta build.
            
            Scarica l'APK qui sotto e installa.
            Se Android blocca l'installazione, abilita "Sorgenti sconosciute" nelle impostazioni di sicurezza.
            
            Gli utenti che hanno già una versione precedente (v0.83+) possono aggiornare direttamente 
            dall'app: Impostazioni → Controlla aggiornamenti.
          draft: false
          prerelease: true
