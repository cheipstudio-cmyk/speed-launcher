name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.4 and create wrapper
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle-install
          export PATH="/opt/gradle-install/gradle-8.4/bin:$PATH"
          gradle wrapper --gradle-version=8.4 --distribution-type=bin
          ls -la gradle/wrapper/
          cat gradle/wrapper/gradle-wrapper.properties

      # v102: genera debug.keystore (referenziato da app/build.gradle)
      - name: Generate debug keystore
        run: |
          keytool -genkey -v -keystore debug.keystore \
            -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          ls -la debug.keystore

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Verify Gradle version via wrapper
        run: ./gradlew --version

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/SpeedLauncher-${{ github.ref_name }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/SpeedLauncher-${{ github.ref_name }}.apk
          tag_name: ${{ github.ref_name }}
          name: Speed Launcher ${{ github.ref_name }}
          body: |
            Speed Launcher beta build.
            
            Scarica l'APK qui sotto e installa.
            Se Android blocca l'installazione, abilita "Sorgenti sconosciute" nelle impostazioni di sicurezza.
            
            Gli utenti che hanno già una versione precedente (v0.83+) possono aggiornare direttamente 
            dall'app: Impostazioni → Controlla aggiornamenti.
          draft: false
          prerelease: true
