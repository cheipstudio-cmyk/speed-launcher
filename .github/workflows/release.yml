name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/SpeedLauncher-${{ github.ref_name }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/SpeedLauncher-${{ github.ref_name }}.apk
          tag_name: ${{ github.ref_name }}
          name: Speed Launcher ${{ github.ref_name }}
          body: |
            Beta build di Speed Launcher.
            
            Scarica l'APK qui sotto e installa.
            Se Android blocca l'installazione, abilita "Sorgenti sconosciute" nelle impostazioni di sicurezza del telefono.
          draft: false
          prerelease: true
