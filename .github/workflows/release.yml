name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.4 and create wrapper
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle-install
          export PATH="/opt/gradle-install/gradle-8.4/bin:$PATH"
          gradle wrapper --gradle-version=8.4 --distribution-type=bin
          ls -la gradle/wrapper/
          cat gradle/wrapper/gradle-wrapper.properties

      # v102: genera debug.keystore (referenziato da app/build.gradle)
      - name: Generate debug keystore (only if missing)
        run: |
          if [ ! -f debug.keystore ]; then
            echo "Generating new debug.keystore"
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "Using existing debug.keystore from repo"
          fi
          ls -la debug.keystore

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Verify Gradle version via wrapper
        run: ./gradlew --version

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p release
          # v112: il file ha nome custom (SpeedLauncher-VERSION-debug.apk), uso wildcard
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" -type f | head -1)
          echo "APK trovato: $APK_PATH"
          cp "$APK_PATH" release/SpeedLauncher-${{ github.ref_name }}.apk
          ls -la release/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ github.ref_name }}"
          APK_FILE="release/SpeedLauncher-${TAG}.apk"
          
          # v120: trasformo TUTTE le prerelease passate in release normali
          # (così l'API releases/latest non si confonde)
          echo "=== Convertendo prerelease vecchie in release normali ==="
          gh release list --limit 50 --json tagName,isPrerelease | \
            jq -r '.[] | select(.isPrerelease == true) | .tagName' | \
            while read OLD_TAG; do
              echo "Converting $OLD_TAG to non-prerelease..."
              gh release edit "$OLD_TAG" --prerelease=false 2>&1 || true
            done
          
          # Se la release esiste già, la elimino e ricreo
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, deleting..."
            gh release delete "$TAG" --yes --cleanup-tag=false
          fi
          
          # Crea release nuova: latest, NON prerelease
          echo "Creating new release $TAG as latest..."
          gh release create "$TAG" \
            --title "Speed Launcher $TAG" \
            --notes "Speed Launcher beta build. Scarica l\'APK qui sotto. Se Android blocca, abilita Sorgenti sconosciute. Aggiornabile in-app: Impostazioni → Controlla aggiornamenti." \
            --latest \
            "$APK_FILE"
          
          # Verifica
          echo "=== Verifica finale ==="
          gh release view "$TAG"
